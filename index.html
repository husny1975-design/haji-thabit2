<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Haji Thabit | PS5 Relapse</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b0f;
      --card-bg: #11141a;
      --border: #1e2330;
      --text: #f8fafc;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background-color: var(--bg); }
    body {
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: min(100%, 680px);
      padding: clamp(24px, 6vw, 44px);
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
      position: relative;
    }
    /* خط هيدر احترافي علوي */
    main::before {
      content: "";
      position: absolute;
      top: -1px; left: 40px; right: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    #cat {
      display: block;
      width: 100%;
      max-width: 480px;
      height: auto;
      max-height: min(50vh, 450px);
      margin: 0 auto 32px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #000;
      object-fit: contain;
      box-shadow: 0 16px 36px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: clamp(28px, 5vw, 38px);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 4px;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .sub {
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }
    #cache-status {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d0f13;
      font-size: 13px;
      text-align: left;
    }
    #cache-status[data-state="success"] { border-color: rgba(34, 197, 94, 0.3); color: #4ade80; }
    #cache-status[data-state="error"] { border-color: rgba(239, 68, 68, 0.3); color: #f87171; }
    #cache-status[data-state="downloading"] { border-color: rgba(56, 189, 248, 0.4); }

    #cache-progress {
      grid-column: 1 / -1;
      width: 100%;
      height: 4px;
      border: 0;
      border-radius: 2px;
      background: #1e293b;
      accent-color: var(--accent);
    }
    #cache-progress::-webkit-progress-bar { border-radius: 2px; background: #1e293b; }
    #cache-progress::-webkit-progress-value { border-radius: 2px; background: var(--accent); }
    #cache-status[data-state="success"] #cache-progress::-webkit-progress-value { background: #22c55e; }
    #cache-status[data-state="error"] #cache-progress::-webkit-progress-value { background: #ef4444; }

    #console {
      width: 100%;
      min-height: 120px;
      max-height: 240px;
      overflow-auto: auto;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d0f13;
      color: #94a3b8;
      font-size: 12px;
      line-height: 1.6;
      text-align: left;
      overflow-wrap: anywhere;
    }
    #console > div {
      padding: 2px 0;
      border-bottom: 1px solid rgba(255,255,255,0.01);
    }
    #console > div::before {
      content: "> ";
      color: var(--accent);
    }
    @media (max-width: 480px) {
      body { padding: 20px 12px; }
      main { padding: 24px 16px; border-radius: 12px; }
      #cat { margin-bottom: 24px; }
      .sub { margin-bottom: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <img id="cat" src="./photo.jpg" alt="Haji Thabit">
    <h1>Haji Thabit</h1>
    <p class="sub">PS5 Relapse</p>
    <div id="cache-status" data-state="checking" role="status" aria-live="polite">
      <span id="cache-label">Checking cache...</span>
      <span id="cache-count">Waiting</span>
      <progress id="cache-progress" max="1" value="0" aria-label="Cache download progress"></progress>
    </div>
    <div id="console" role="log" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      const status = document.getElementById("cache-status");
      const label = document.getElementById("cache-label");
      const count = document.getElementById("cache-count");
      const progress = document.getElementById("cache-progress");
      const cache = window.applicationCache;

      function showState(text, state) {
        label.textContent = text;
        status.dataset.state = state;
      }

      if (!cache) {
        showState("Offline cache is not supported", "error");
      } else {
        cache.addEventListener("checking", () => showState("Checking cache...", "checking"));
        cache.addEventListener("downloading", () => {
          count.textContent = "0 / ? resources";
          progress.value = 0;
          showState("Downloading cache...", "downloading");
        });
        cache.addEventListener("progress", (event) => {
          const total = event.total || 0;
          count.textContent = `${event.loaded} / ${total || "?"} resources`;
          if (total) progress.value = event.loaded / total;
          showState("Downloading cache...", "downloading");
        });
        cache.addEventListener("cached", () => {
          progress.value = 1;
          showState("Cache downloaded successfully", "success");
          if (count.textContent === "Waiting") count.textContent = "Ready";
        });
        cache.addEventListener("noupdate", () => {
          progress.value = 1;
          count.textContent = "Up to date";
          showState("Cache is ready", "success");
        });
        cache.addEventListener("updateready", () => {
          progress.value = 1;
          showState("Cache update downloaded successfully", "success");
        });
        cache.addEventListener("error", () => showState("Cache download failed", "error"));
        cache.addEventListener("obsolete", () => showState("Cache manifest is unavailable", "error"));

        if (cache.status === cache.IDLE) {
          progress.value = 1;
          count.textContent = "Ready";
          showState("Cache is ready", "success");
        } else if (cache.status === cache.UPDATEREADY) {
          progress.value = 1;
          showState("Cache update downloaded successfully", "success");
        } else if (cache.status === cache.OBSOLETE) {
          showState("Cache manifest is unavailable", "error");
        } else if (cache.status === cache.DOWNLOADING) {
          showState("Downloading cache...", "downloading");
        }
      }
    })();
  </script>
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
