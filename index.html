<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Haji Thabit | PS5 Relapse</title>
  <style>
    :root {
      color-scheme: dark;
      --gold: #e3c477;
      --gold-soft: rgba(227, 196, 119, .34);
      --ivory: #f5f0e5;
      --muted: #c9c0ad;
      --glass: rgba(19, 19, 18, .64);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      padding: 36px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 5%, rgba(187, 145, 55, .22), transparent 42%),
        radial-gradient(ellipse at 8% 85%, rgba(144, 105, 35, .12), transparent 34%),
        repeating-linear-gradient(135deg, transparent 0 34px, rgba(218, 176, 75, .3) 35px, transparent 36px 70px),
        #080808;
      color: var(--ivory);
      font: 16px/1.5 "Segoe UI", Arial, sans-serif;
    }
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 35%, rgba(0, 0, 0, .48) 100%);
    }
    main {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: min(100%, 760px);
      padding: clamp(24px, 5vw, 50px);
      text-align: center;
      border: 1px solid rgba(232, 195, 107, .48);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(35, 33, 29, .72), rgba(8, 8, 8, .68));
      box-shadow: 0 30px 90px rgba(0, 0, 0, .68), inset 0 1px rgba(255, 255, 255, .16), 0 0 48px rgba(205, 164, 67, .13);
      -webkit-backdrop-filter: blur(24px) saturate(135%);
      backdrop-filter: blur(24px) saturate(135%);
    }
    main::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: 0;
      left: 10%;
      width: 80%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 239, 190, .8), transparent);
      pointer-events: none;
    }
    #cat {
      display: block;
      width: min(100%, 560px);
      height: auto;
      max-height: min(62vh, 680px);
      margin: 0 auto 26px;
      border: 1px solid rgba(232, 195, 107, .7);
      border-radius: 18px;
      background: rgba(0, 0, 0, .28);
      object-fit: contain;
      box-shadow: 0 20px 54px rgba(0, 0, 0, .52), 0 0 30px rgba(218, 176, 75, .15);
    }
    h1 {
      margin: 0;
      color: #f1d991;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 6vw, 50px);
      font-weight: 500;
      letter-spacing: .075em;
      text-shadow: 0 2px 24px rgba(218, 176, 75, .28);
    }
    .sub {
      margin: 8px 0 26px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    #cache-status {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 9px 14px;
      margin-bottom: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(218, 176, 75, .3);
      border-radius: 14px;
      background: rgba(0, 0, 0, .32);
      color: #e0d7c2;
      font-size: 13px;
      text-align: left;
      box-shadow: inset 0 1px rgba(255, 255, 255, .045);
    }
    #cache-status[data-state="success"] { border-color: #78976b; color: #c3dfb2; }
    #cache-status[data-state="error"] { border-color: #a45b51; color: #f0aaa0; }
    #cache-progress {
      grid-column: 1 / -1;
      width: 100%;
      height: 8px;
      border: 0;
      border-radius: 4px;
      background: #24211a;
      accent-color: #d8ad4c;
    }
    #cache-progress::-webkit-progress-bar { border-radius: 4px; background: #24211a; }
    #cache-progress::-webkit-progress-value { border-radius: 4px; background: linear-gradient(90deg, #a97c22, #f1d27b); }
    #cache-status[data-state="error"] #cache-progress::-webkit-progress-value { background: #dd7777; }
    #console {
      width: 100%;
      min-height: 150px;
      max-height: min(42vh, 360px);
      overflow: auto;
      padding: 16px 18px;
      border: 1px solid rgba(218, 176, 75, .26);
      border-radius: 14px;
      background: rgba(0, 0, 0, .42);
      box-shadow: inset 0 1px rgba(255, 255, 255, .06);
      color: #e0d7c2;
      text-align: left;
      overflow-wrap: anywhere;
    }
    #console > div { padding: 3px 0; }
    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      main { padding: 24px 16px; border-radius: 20px; }
      #cat { max-height: 52vh; margin-bottom: 21px; }
      #console { min-height: 130px; padding: 12px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: arrive .7s ease-out both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <main>
    <img id="cat" src="./photo.jpg" alt="Haji Thabit">
    <h1>Haji Thabit</h1>
    <p class="sub">PS5 Relapse</p>
    <div id="cache-status" data-state="checking" role="status" aria-live="polite">
      <span id="cache-label">Checking cache...</span>
      <span id="cache-count">Waiting</span>
      <progress id="cache-progress" max="1" value="0" aria-label="Cache download progress"></progress>
    </div>
    <div id="console" role="log" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      const status = document.getElementById("cache-status");
      const label = document.getElementById("cache-label");
      const count = document.getElementById("cache-count");
      const progress = document.getElementById("cache-progress");
      const cache = window.applicationCache;

      function showState(text, state) {
        label.textContent = text;
        status.dataset.state = state;
      }

      if (!cache) {
        showState("Offline cache is not supported", "error");
      } else {
        cache.addEventListener("checking", () => showState("Checking cache...", "checking"));
        cache.addEventListener("downloading", () => {
          count.textContent = "0 / ? resources";
          progress.value = 0;
          showState("Downloading cache...", "downloading");
        });
        cache.addEventListener("progress", (event) => {
          const total = event.total || 0;
          count.textContent = `${event.loaded} / ${total || "?"} resources`;
          if (total) progress.value = event.loaded / total;
          showState("Downloading cache...", "downloading");
        });
        cache.addEventListener("cached", () => {
          progress.value = 1;
          showState("Cache downloaded successfully", "success");
          if (count.textContent === "Waiting") count.textContent = "Ready";
        });
        cache.addEventListener("noupdate", () => {
          progress.value = 1;
          count.textContent = "Up to date";
          showState("Cache is ready", "success");
        });
        cache.addEventListener("updateready", () => {
          progress.value = 1;
          showState("Cache update downloaded successfully", "success");
        });
        cache.addEventListener("error", () => showState("Cache download failed", "error"));
        cache.addEventListener("obsolete", () => showState("Cache manifest is unavailable", "error"));

        if (cache.status === cache.IDLE) {
          progress.value = 1;
          count.textContent = "Ready";
          showState("Cache is ready", "success");
        } else if (cache.status === cache.UPDATEREADY) {
          progress.value = 1;
          showState("Cache update downloaded successfully", "success");
        } else if (cache.status === cache.OBSOLETE) {
          showState("Cache manifest is unavailable", "error");
        } else if (cache.status === cache.DOWNLOADING) {
          showState("Downloading cache...", "downloading");
        }
      }
    })();
  </script>
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
