<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Haji Thabit | PS5 Relapse</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --glass: rgba(15, 23, 42, 0.6);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      padding: 36px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 18% 12%, rgba(30, 41, 59, 0.95), transparent 36%),
        radial-gradient(ellipse at 84% 78%, rgba(15, 23, 42, 0.8), transparent 38%),
        linear-gradient(135deg, #0f172a, #1e293b 48%, #090d16);
      color: var(--ink);
      font: 16px/1.55 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    body::before, body::after {
      content: "";
      position: fixed;
      z-index: -1;
      width: 42vw;
      height: 42vw;
      min-width: 280px;
      min-height: 280px;
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
    }
    body::before { top: -18vw; right: -10vw; background: rgba(30, 41, 59, 0.48); }
    body::after { bottom: -22vw; left: -12vw; background: rgba(15, 23, 42, 0.5); }
    main {
      position: relative;
      width: min(100%, 760px);
      padding: clamp(24px, 5vw, 50px);
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.76), rgba(15, 23, 42, 0.48));
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), inset 0 1px rgba(255, 255, 255, 0.1);
      -webkit-backdrop-filter: blur(24px) saturate(125%);
      backdrop-filter: blur(24px) saturate(125%);
    }
    main::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
      pointer-events: none;
    }
    #cat {
      display: block;
      width: min(100%, 560px);
      height: auto;
      max-height: min(62vh, 680px);
      margin: 0 auto 26px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.34);
      object-fit: contain;
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.4);
    }
    h1 {
      margin: 0;
      color: #f8fafc;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 6vw, 50px);
      font-weight: 500;
      letter-spacing: .045em;
    }
    .sub {
      margin: 8px 0 26px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }
    #cache-status {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 9px 14px;
      margin-bottom: 14px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.42);
      color: #cbd5e1;
      font-size: 13px;
      text-align: left;
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.05);
    }
    #cache-status[data-state="success"] { border-color: #22c55e; color: #4ade80; }
    #cache-status[data-state="error"] { border-color: #ef4444; color: #f87171; }
    #cache-progress {
      grid-column: 1 / -1;
      width: 100%;
      height: 8px;
      border: 0;
      border-radius: 4px;
      background: #334155;
      accent-color: var(--accent);
    }
    #cache-progress::-webkit-progress-bar { border-radius: 4px; background: #334155; }
    #cache-progress::-webkit-progress-value { border-radius: 4px; background: linear-gradient(90deg, #38bdf8, #0ea5e9); }
    #cache-status[data-state="error"] #cache-progress::-webkit-progress-value { background: #ef4444; }
    #console {
      width: 100%;
      min-height: 150px;
      max-height: min(42vh, 360px);
      overflow: auto;
      padding: 16px 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.38);
      box-shadow: inset 0 1px rgba(255, 255, 255, 0.05);
      color: #cbd5e1;
      text-align: left;
      overflow-wrap: anywhere;
    }
    #console > div { padding: 3px 0; }
    @media (max-width: 480px) {
      body { padding: 18px 12px; }
      main { padding: 24px 16px; border-radius: 22px; }
      #cat { max-height: 52vh; margin-bottom: 21px; }
      #console { min-height: 130px; padding: 12px; font-size: 14px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: arrive .7s ease-out both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <main>
    <img id="cat" src="./photo.jpg" alt="Haji Thabit">
    <h1>Haji Thabit</h1>
    <p class="sub">PS5 Relapse</p>
    <div id="cache-status" data-state="checking" role="status" aria-live="polite">
      <span id="cache-label">Checking cache...</span>
      <span id="cache-count">Waiting</span>
      <progress id="cache-progress" max="1" value="0" aria-label="Cache download progress"></progress>
    </div>
    <div id="console" role="log" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      const status = document.getElementById("cache-status");
      const label = document.getElementById("cache-label");
      const count = document.getElementById("cache-count");
      const progress = document.getElementById("cache-progress");
      const cache = window.applicationCache;

      function showState(text, state) {
        label.textContent = text;
        status.dataset.state = state;
      }

      if (!cache) {
        showState("Offline cache is not supported", "error");
      } else {
        cache.addEventListener("checking", () => showState("Checking cache...", "checking"));
        cache.addEventListener("downloading", () => {
          count.textContent = "0 / ? resources";
          progress.value = 0;
          showState("Downloading cache...", "downloading");
        });
        cache.addEventListener("progress", (event) => {
          const total = event.total || 0;
          count.textContent = `${event.loaded} / ${total || "?"} resources`;
          if (total) progress.value = event.loaded / total;
          showState("Downloading cache...", "downloading");
        });
        cache.addEventListener("cached", () => {
          progress.value = 1;
          showState("Cache downloaded successfully", "success");
          if (count.textContent === "Waiting") count.textContent = "Ready";
        });
        cache.addEventListener("noupdate", () => {
          progress.value = 1;
          count.textContent = "Up to date";
          showState("Cache is ready", "success");
        });
        cache.addEventListener("updateready", () => {
          progress.value = 1;
          showState("Cache update downloaded successfully", "success");
        });
        cache.addEventListener("error", () => showState("Cache download failed", "error"));
        cache.addEventListener("obsolete", () => showState("Cache manifest is unavailable", "error"));

        if (cache.status === cache.IDLE) {
          progress.value = 1;
          count.textContent = "Ready";
          showState("Cache is ready", "success");
        } else if (cache.status === cache.UPDATEREADY) {
          progress.value = 1;
          showState("Cache update downloaded successfully", "success");
        } else if (cache.status === cache.OBSOLETE) {
          showState("Cache manifest is unavailable", "error");
        } else if (cache.status === cache.DOWNLOADING) {
          showState("Downloading cache...", "downloading");
        }
      }
    })();
  </script>
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
