<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Haji Thabit | PS5 Relapse</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070a;
      --card-bg: #0b0e14;
      --border: #1a1f2c;
      --text: #f1f5f9;
      --text-muted: #64748b;
      --accent: #0ea5e9;
      --accent-glow: rgba(14, 165, 233, 0.15);
      --success: #22c55e;
      --error: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background-color: var(--bg); }
    body {
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 50% 0%, rgba(14, 165, 233, 0.05) 0%, transparent 40%);
    }
    main {
      width: min(100%, 600px);
      padding: clamp(24px, 6vw, 40px);
      border: 1px solid var(--border);
      border-radius: 20px;
      background: linear-gradient(145deg, #0d111a, #090c12);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      position: relative;
      text-align: center;
    }
    main::before {
      content: "";
      position: absolute;
      top: -1px; left: 30px; right: 30px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    #cat {
      display: block;
      width: 100%;
      max-width: 440px;
      height: auto;
      max-height: min(45vh, 380px);
      margin: 0 auto 28px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      background: #000;
      object-fit: contain;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    h1 {
      font-size: clamp(26px, 5vw, 34px);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .sub {
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      margin-bottom: 32px;
      opacity: 0.85;
    }
    #cache-status {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding: 18px 22px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(13, 17, 26, 0.7);
      font-size: 13.5px;
      text-align: left;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
    }
    #cache-status[data-state="success"] { border-color: rgba(34, 197, 94, 0.25); color: var(--success); background: rgba(34, 197, 94, 0.02); }
    #cache-status[data-state="error"] { border-color: rgba(239, 68, 68, 0.25); color: var(--error); background: rgba(239, 68, 68, 0.02); }
    #cache-status[data-state="downloading"] { border-color: rgba(14, 165, 233, 0.3); background: rgba(14, 165, 233, 0.02); }

    #cache-label {
      font-weight: 500;
    }
    #cache-status[data-state="checking"] { border-color: var(--border); color: var(--text); }
    
    #cache-count {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      opacity: 0.8;
    }

    #cache-progress {
      grid-column: 1 / -1;
      width: 100%;
      height: 6px;
      border: 0;
      border-radius: 10px;
      background: #1e293b;
      appearance: none;
      -webkit-appearance: none;
      overflow: hidden;
    }
    #cache-progress::-webkit-progress-bar { border-radius: 10px; background: #141b26; }
    #cache-progress::-webkit-progress-value { border-radius: 10px; background: var(--accent); transition: width 0.3s ease; box-shadow: 0 0 10px var(--accent-glow); }
    #cache-status[data-state="success"] #cache-progress::-webkit-progress-value { background: var(--success); box-shadow: 0 0 10px rgba(34, 197, 94, 0.3); }
    #cache-status[data-state="error"] #cache-progress::-webkit-progress-value { background: var(--error); box-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }

    #console {
      width: 100%;
      min-height: 110px;
      max-height: 200px;
      overflow-y: auto;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #06080c;
      color: #94a3b8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.6;
      text-align: left;
      overflow-wrap: anywhere;
    }
    #console > div {
      padding: 3px 0;
      border-bottom: 1px solid rgba(255,255,255,0.01);
    }
    #console > div::before {
      content: "> ";
      color: var(--accent);
      font-weight: bold;
    }
    @media (max-width: 480px) {
      body { padding: 16px 12px; }
      main { padding: 28px 20px; border-radius: 16px; }
      #cat { margin-bottom: 20px; }
      .sub { margin-bottom: 24px; }
    }
  </style>
</head>
<body>
  <main>
    <!-- تم تعديل اسم الصورة هنا إلى photo2.jpg -->
    <img id="cat" src="./photo2.jpg" alt="Haji Thabit">
    <h1>Haji Thabit</h1>
    <p class="sub">PS5 Relapse</p>
    <div id="cache-status" data-state="checking" role="status" aria-live="polite">
      <span id="cache-label">Checking cache...</span>
      <span id="cache-count">Waiting</span>
      <progress id="cache-progress" max="1" value="0" aria-label="Cache download progress"></progress>
    </div>
    <div id="console" role="log" aria-live="polite"></div>
  </main>
  <script>
    (() => {
      const status = document.getElementById("cache-status");
      const label = document.getElementById("cache-label");
      const count = document.getElementById("cache-count");
      const progress = document.getElementById("cache-progress");
      const cache = window.applicationCache;

      function showState(text, state) {
        label.textContent = text;
        status.dataset.state = state;
      }

      if (!cache) {
        showState("Offline cache is not supported", "error");
      } else {
        cache.addEventListener("checking", () => showState("Checking cache...", "checking"));
        cache.addEventListener("downloading", () => {
          count.textContent = "0 / ? resources";
          progress.value = 0;
          showState("Downloading cache...", "downloading");
        });
        cache.addEventListener("progress", (event) => {
          const total = event.total || 0;
          count.textContent = `${event.loaded} / ${total || "?"} resources`;
          if (total) progress.value = event.loaded / total;
          showState("Downloading cache...", "downloading");
        });
        cache.addEventListener("cached", () => {
          progress.value = 1;
          showState("Cache downloaded successfully", "success");
          if (count.textContent === "Waiting") count.textContent = "Ready";
        });
        cache.addEventListener("noupdate", () => {
          progress.value = 1;
          count.textContent = "Up to date";
          showState("Cache is ready", "success");
        });
        cache.addEventListener("updateready", () => {
          progress.value = 1;
          showState("Cache update downloaded successfully", "success");
        });
        cache.addEventListener("error", () => showState("Cache download failed", "error"));
        cache.addEventListener("obsolete", () => showState("Cache manifest is unavailable", "error"));

        if (cache.status === cache.IDLE) {
          progress.value = 1;
          count.textContent = "Ready";
          showState("Cache is ready", "success");
        } else if (cache.status === cache.UPDATEREADY) {
          progress.value = 1;
          showState("Cache update downloaded successfully", "success");
        } else if (cache.status === cache.OBSOLETE) {
          showState("Cache manifest is unavailable", "error");
        } else if (cache.status === cache.DOWNLOADING) {
          showState("Downloading cache...", "downloading");
        }
      }
    })();
  </script>
  <script src="./src/firmware.js"></script>
  <script src="./src/main.js"></script>
  <script src="./src/rop.js"></script>
  <script src="./src/utils/syscalls.js"></script>
  <script type="module" src="./src/site.js"></script>
</body>
</html>
